<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAKHANANI Class Tracker PRO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15803d">
<style>
*{box-sizing:border-box;font-family:system-ui,Segoe UI}body{margin:0;background:#f1f5f9}
header{background:#15803d;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:10}
.tabs{display:flex;background:#fff;position:sticky;top:72px;z-index:9;box-shadow:0 2px 6px #0001}
.tabs button{flex:1;padding:12px;border:none;background:#fff;font-weight:800;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.active{border-color:#15803d;color:#15803d;background:#dcfce7}
.card{background:#fff;margin:10px;border-radius:14px;padding:12px;box-shadow:0 2px 8px #0001}
input,select{width:100%;padding:11px;margin:5px 0;border:1.5px solid #cbd5e1;border-radius:10px}
.btn{padding:11px 14px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
.btn-green{background:#15803d;color:#fff}.btn-gray{background:#e2e8f0}.btn-red{background:#b91c1c;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #e2e8f0;padding:6px;text-align:left}
.badge{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:800}
.present{background:#dcfce7;color:#166534}.absent{background:#fee2e2;color:#991b1b}.late{background:#fef9c3;color:#854d0e}
.small{font-size:12px;color:#64748b}
</style>
</head>
<body>
<header>
<h2 style="margin:0">📋 MAKHANANI Class Tracker PRO</h2>
<small>Vukona Press | Offline | CAPS 2026 | Vusi Chauke</small>
<div style="margin-top:8px">
<button class="btn btn-gray" onclick="location.href='../'">🏠 Maths Lit</button>
<button class="btn btn-gray" onclick="location.href='../health/'">🏥 Health</button>
<button class="btn btn-gray" onclick="location.href='../quiz/'">🎓 Quiz</button>
</div>
</header>
<div class="tabs">
<button id="t1" class="active" onclick="showTab(1)">👥 Students</button>
<button id="t2" onclick="showTab(2)">📋 Attendance</button>
<button id="t3" onclick="showTab(3)">📝 Weekly Tests</button>
<button id="t4" onclick="showTab(4)">📊 Performance</button>
</div>

<!-- TAB 1 -->
<div id="tab1" class="card">
<h3>1. Add Student</h3>
<div class="grid2">
<input id="sName" placeholder="Full Name e.g. Thabo Makhubela">
<input id="sNo" placeholder="Student No e.g. 202601">
</div>
<div class="grid2">
<select id="sClass"><option>12A</option><option>12B</option><option>12C</option><option>11A</option><option>11B</option><option>10A</option></select>
<button class="btn btn-green" onclick="addStudent()">+ Add Student</button>
</div>
<div style="margin-top:10px" class="row">
<button class="btn btn-gray" onclick="exportCSV('students')">⬇ Export Students CSV</button>
<button class="btn btn-red" onclick="clearAll()">🗑 Clear All</button>
</div>
<table id="studentTable" style="margin-top:10px"><thead><tr><th>#</th><th>Name</th><th>Class</th><th>Action</th></tr></thead><tbody></tbody></table>
</div>

<!-- TAB 2 -->
<div id="tab2" class="card" style="display:none">
<h3>2. Attendance Register</h3>
<div class="grid2">
<input id="attDate" type="date">
<select id="attClassFilter" onchange="renderAttendance()"><option value="ALL">ALL Classes</option><option>12A</option><option>12B</option><option>12C</option><option>11A</option><option>11B</option><option>10A</option></select>
</div>
<div class="row" style="margin:8px 0">
<button class="btn btn-green" onclick="markAll('Present')">Mark All Present</button>
<button class="btn btn-gray" onclick="saveAttendance()">💾 Save Attendance</button>
<button class="btn btn-gray" onclick="exportCSV('attendance')">⬇ Export Attendance</button>
</div>
<div id="attList"></div>
<small class="small">Saved in phone - works offline ✈️</small>
</div>

<!-- TAB 3 -->
<div id="tab3" class="card" style="display:none">
<h3>3. Weekly Tests (12 Weeks)</h3>
<div class="grid2">
<select id="testWeek"><option>Week 1</option><option>Week 2</option><option>Week 3</option><option>Week 4</option><option>Week 5</option><option>Week 6</option><option>Week 7</option><option>Week 8</option><option>Week 9</option><option>Week 10</option><option>Week 11</option><option>Week 12</option></select>
<input id="testTopic" placeholder="Topic e.g. Finance - Hire Purchase">
</div>
<div class="grid2">
<select id="testStudent"></select>
<input id="testScore" type="number" placeholder="Score e.g. 15">
</div>
<div class="grid2">
<input id="testTotal" type="number" value="20">
<button class="btn btn-green" onclick="addTest()">+ Save Mark</button>
</div>
<table id="testTable" style="margin-top:10px"><thead><tr><th>Week</th><th>Student</th><th>Topic</th><th>Score</th><th>%</th></tr></thead><tbody></tbody></table>
<div class="row" style="margin-top:8px"><button class="btn btn-gray" onclick="exportCSV('tests')">⬇ Export Tests CSV</button></div>
</div>

<!-- TAB 4 -->
<div id="tab4" class="card" style="display:none">
<h3>4. Performance Dashboard</h3>
<select id="perfStudent" onchange="renderPerf()"></select>
<canvas id="perfCanvas" width="320" height="160" style="width:100%;background:#f8fafc;border-radius:10px;margin-top:8px"></canvas>
<div id="perfStats" style="margin-top:10px"></div>
<h4>Class Ranking & At Risk (<50%)</h4>
<div id="ranking"></div>
</div>

<script>
let db = JSON.parse(localStorage.getItem('mk_class_db')||'{"students":[],"attendance":{},"tests":[]}');
function saveDB(){localStorage.setItem('mk_class_db',JSON.stringify(db));}
function showTab(n){[1,2,3,4].forEach(i=>{document.getElementById('tab'+i).style.display=i==n?'block':'none';document.getElementById('t'+i).classList.toggle('active',i==n);});if(n==4)renderPerf();}
function addStudent(){
let name=sName.value.trim(); let no=sNo.value.trim(); let cls=sClass.value;
if(!name){alert('Enter name');return;}
db.students.push({id:Date.now(),name,no,class:cls});
sName.value='';sNo.value='';saveDB();renderStudents();
}
function deleteStudent(id){if(!confirm('Delete?'))return;db.students=db.students.filter(s=>s.id!=id);saveDB();renderStudents();}
function renderStudents(){
let tb=document.querySelector('#studentTable tbody');tb.innerHTML='';
db.students.forEach((s,i)=>{
   tb.innerHTML+=`<tr><td>${i+1}</td><td>${s.name}<br><small>${s.no}</small></td><td>${s.class}</td><td><button onclick="deleteStudent(${s.id})">❌</button></td></tr>`;
});
let opts=db.students.map(s=>`<option value="${s.id}">${s.name} (${s.class})</option>`).join('');
document.getElementById('testStudent').innerHTML=opts;
document.getElementById('perfStudent').innerHTML=opts;
}
function renderAttendance(){
let date=attDate.value||new Date().toISOString().slice(0,10); attDate.value=date;
let filter=attClassFilter.value;
let list=document.getElementById('attList'); list.innerHTML='';
let filtered=db.students.filter(s=>filter=='ALL'||s.class==filter);
let dayData=db.attendance[date]||{};
filtered.forEach(s=>{
   let cur=dayData[s.id]||'Present';
   list.innerHTML+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #eee">
   <div><b>${s.name}</b><br><small>${s.class} • ${s.no}</small></div>
   <select id="att_${s.id}" style="width:120px"><option ${cur=='Present'?'selected':''}>Present</option><option ${cur=='Absent'?'selected':''}>Absent</option><option ${cur=='Late'?'selected':''}>Late</option></select></div>`;
});
}
function markAll(v){db.students.forEach(s=>{let el=document.getElementById('att_'+s.id); if(el) el.value=v;});}
function saveAttendance(){
let date=attDate.value; if(!date){alert('Pick date');return;}
db.attendance[date]=db.attendance[date]||{};
db.students.forEach(s=>{let el=document.getElementById('att_'+s.id); if(el) db.attendance[date][s.id]=el.value;});
saveDB();alert('Attendance saved for '+date+' ✅');
}
function addTest(){
let week=testWeek.value; let topic=testTopic.value.trim()||'General'; let sid=parseInt(testStudent.value); let score=parseFloat(testScore.value); let total=parseFloat(testTotal.value)||20;
if(!sid||isNaN(score)){alert('Select student + score');return;}
let stu=db.students.find(s=>s.id==sid); let pct=(score/total*100);
db.tests.push({id:Date.now(),week,topic,studentId:sid,studentName:stu.name,class:stu.class,score,total,pct:Math.round(pct)});
saveDB(); testScore.value=''; renderTests();
}
function renderTests(){
let tb=document.querySelector('#testTable tbody'); tb.innerHTML='';
db.tests.slice().reverse().slice(0,50).forEach(t=>{
   tb.innerHTML+=`<tr><td>${t.week}</td><td>${t.studentName}</td><td>${t.topic}</td><td>${t.score}/${t.total}</td><td><b style="color:${t.pct<50?'red':'green'}">${t.pct}%</b></td></tr>`;
});
}
function renderPerf(){
let sid=parseInt(perfStudent.value); if(!sid) return;
let tests=db.tests.filter(t=>t.studentId==sid).sort((a,b)=>a.id-b.id);
let c=document.getElementById('perfCanvas'); let ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
if(!tests.length){document.getElementById('perfStats').innerHTML='No tests yet'; return;}
// draw simple line
ctx.strokeStyle='#15803d'; ctx.lineWidth=3; ctx.beginPath();
tests.forEach((t,i)=>{let x=20+i*(280/Math.max(1,tests.length-1)); let y=140-t.pct*1.2; if(i==0)ctx.moveTo(x,y); else ctx.lineTo(x,y);});
ctx.stroke();
tests.forEach((t,i)=>{let x=20+i*(280/Math.max(1,tests.length-1)); let y=140-t.pct*1.2; ctx.fillStyle='#15803d'; ctx.beginPath(); ctx.arc(x,y,4,0,6.28); ctx.fill();});
let avg=Math.round(tests.reduce((a,b)=>a+b.pct,0)/tests.length);
let attKeys=Object.keys(db.attendance); let present=attKeys.filter(d=>db.attendance[d][sid]=='Present').length;
let attPct=attKeys.length?Math.round(present/attKeys.length*100):0;
document.getElementById('perfStats').innerHTML=`<div class="grid2"><div class="card" style="margin:0">Avg: <b>${avg}%</b></div><div class="card" style="margin:0">Attendance: <b>${attPct}%</b></div></div><small>${tests.map(t=>t.week+':'+t.pct+'%').join(' | ')}</small>`;
// ranking
let map={}; db.tests.forEach(t=>{map[t.studentId]=map[t.studentId]||{name:t.studentName,class:t.class,scores:[]}; map[t.studentId].scores.push(t.pct);});
let ranking=Object.entries(map).map(([id,o])=>({id,name:o.name,class:o.class,avg:Math.round(o.scores.reduce((a,b)=>a+b,0)/o.scores.length)})).sort((a,b)=>b.avg-a.avg);
let html='<table><tr><th>Rank</th><th>Name</th><th>Avg</th><th>Status</th></tr>';
ranking.forEach((r,i)=>{html+=`<tr><td>${i+1}</td><td>${r.name} (${r.class})</td><td>${r.avg}%</td><td>${r.avg<50?'<span class="badge absent">At Risk</span>':'<span class="badge present">OK</span>'}</td></tr>`;});
html+='</table>'; document.getElementById('ranking').innerHTML=html;
}
function exportCSV(type){
let csv=''; if(type=='students'){csv='Name,No,Class\n'+db.students.map(s=>`"${s.name}",${s.no},${s.class}`).join('\n');}
if(type=='attendance'){csv='Date,Student,Class,Status\n'; for(let d in db.attendance){for(let sid in db.attendance[d]){let st=db.students.find(s=>s.id==sid); if(st) csv+=`${d},"${st.name}",${st.class},${db.attendance[d][sid]}\n`;}}}
if(type=='tests'){csv='Week,Topic,Student,Class,Score,Total,Percent\n'+db.tests.map(t=>`${t.week},"${t.topic}","${t.studentName}",${t.class},${t.score},${t.total},${t.pct}%`).join('\n');}
let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=type+'.csv'; a.click();
}
function clearAll(){if(!confirm('Clear ALL students, attendance, tests?'))return; db={students:[],attendance:{},tests:[]}; saveDB(); renderStudents(); renderAttendance(); renderTests();}

attDate.valueAsDate=new Date(); renderStudents(); renderAttendance(); renderTests();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
